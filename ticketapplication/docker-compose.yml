version: '3.9'

# ═══════════════════════════════════════════════════════════════
#  TicketDesk — Full Microservices docker-compose
#  Services: 5 databases + 7 Spring Boot services + React frontend
# ═══════════════════════════════════════════════════════════════

networks:
  ticketdesk-net:
    driver: bridge

# ─── Shared volumes ────────────────────────────────────────────
volumes:
  mysql_users_data:
  mysql_tickets_data:
  mysql_comments_data:
  mysql_attachments_data:
  attachment_uploads:

services:

  # ─────────────────────────────────────────────────────────────
  # DATABASES
  # ─────────────────────────────────────────────────────────────

  mysql-users:
    image: mysql:8.0
    container_name: td-mysql-users
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Pranuu@0903
      MYSQL_DATABASE: users_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    networks:
      - ticketdesk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pPranuu@0903"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-tickets:
    image: mysql:8.0
    container_name: td-mysql-tickets
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Pranuu@0903
      MYSQL_DATABASE: ticketdesk_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_tickets_data:/var/lib/mysql
    networks:
      - ticketdesk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pPranuu@0903"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-comments:
    image: mysql:8.0
    container_name: td-mysql-comments
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Pranuu@0903
      MYSQL_DATABASE: comments_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_comments_data:/var/lib/mysql
    networks:
      - ticketdesk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pPranuu@0903"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-attachments:
    image: mysql:8.0
    container_name: td-mysql-attachments
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Pranuu@0903
      MYSQL_DATABASE: attachments_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_attachments_data:/var/lib/mysql
    networks:
      - ticketdesk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pPranuu@0903"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # SPRING BOOT MICROSERVICES
  # ─────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: td-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-users:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Pranuu@0903
    depends_on:
      mysql-users:
        condition: service_healthy
    networks:
      - ticketdesk-net

  ticket-service:
    build:
      context: ./backend/ticket-service
    container_name: td-ticket-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-tickets:3306/ticketdesk_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Pranuu@0903
    depends_on:
      mysql-tickets:
        condition: service_healthy
    networks:
      - ticketdesk-net

  user-service:
    build:
      context: ./backend/user-service
    container_name: td-user-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-users:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Pranuu@0903
    depends_on:
      mysql-users:
        condition: service_healthy
    networks:
      - ticketdesk-net

  comment-service:
    build:
      context: ./backend/comment-service
    container_name: td-comment-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comments:3306/comments_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Pranuu@0903
    depends_on:
      mysql-comments:
        condition: service_healthy
    networks:
      - ticketdesk-net

  attachment-service:
    build:
      context: ./backend/attachment-service
    container_name: td-attachment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-attachments:3306/attachments_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Pranuu@0903
      UPLOAD_DIR: /app/uploads
    volumes:
      - attachment_uploads:/app/uploads
    depends_on:
      mysql-attachments:
        condition: service_healthy
    networks:
      - ticketdesk-net

  dashboard-service:
    build:
      context: ./backend/dashboard-service
    container_name: td-dashboard-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-tickets:3306/ticketdesk_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Pranuu@0903
    depends_on:
      mysql-tickets:
        condition: service_healthy
    networks:
      - ticketdesk-net

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: td-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://td-auth-service:8081
      TICKET_SERVICE_URL: http://td-ticket-service:8082
      USER_SERVICE_URL: http://td-user-service:8083
      COMMENT_SERVICE_URL: http://td-comment-service:8084
      ATTACHMENT_SERVICE_URL: http://td-attachment-service:8085
      DASHBOARD_SERVICE_URL: http://td-dashboard-service:8087
    depends_on:
      - ticket-service
      - auth-service
      - user-service
      - comment-service
      - attachment-service
      - dashboard-service
    networks:
      - ticketdesk-net

  # ─────────────────────────────────────────────────────────────
  # REACT FRONTEND (Nginx)
  # ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
    container_name: td-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - ticketdesk-net
