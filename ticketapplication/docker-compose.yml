services:
  # ── 1. MySQL Database Service ──────────────────────────────────────────────
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: prasad
      MYSQL_DATABASE: ticketdesk_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pprasad"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketdesk-net

  # ── 2. Eureka Service Discovery ────────────────────────────────────────────
  eureka-server:
    image: prasad917/eureka-server:latest
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ticketdesk-net

  # ── 3. API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    image: prasad917/api-gateway:latest
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - ticketdesk-net

  # ── 4. Auth Service ─────────────────────────────────────────────────────────
  auth-service:
    image: prasad917/auth-service:latest
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8089:8089"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=prasad
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ticketdesk-net

  # ── 5. Ticket Service ───────────────────────────────────────────────────────
  ticket-service:
    image: prasad917/ticket-service:latest
    build:
      context: ./backend/ticket-service
      dockerfile: Dockerfile
    container_name: ticket-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=prasad
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ticketdesk-net

  # ── 6. Comment Service ──────────────────────────────────────────────────────
  comment-service:
    image: prasad917/comment-service:latest
    build:
      context: ./backend/comment-service
      dockerfile: Dockerfile
    container_name: comment-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=prasad
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ticketdesk-net

  # ── 7. Attachment Service ───────────────────────────────────────────────────
  attachment-service:
    image: prasad917/attachment-service:latest
    build:
      context: ./backend/attachment-service
      dockerfile: Dockerfile
    container_name: attachment-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=prasad
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ticketdesk-net

  # ── 8. Dashboard Service ────────────────────────────────────────────────────
  dashboard-service:
    image: prasad917/dashboard-service:latest
    build:
      context: ./backend/dashboard-service
      dockerfile: Dockerfile
    container_name: dashboard-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=prasad
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ticketdesk-net

  # ── 9. Frontend Service ─────────────────────────────────────────────────────
  frontend:
    image: prasad917/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - ticketdesk-net

networks:
  ticketdesk-net:
    driver: bridge

volumes:
  mysql-data:
